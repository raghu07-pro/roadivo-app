# Roadivo — SwiftLint. Run `swiftlint --strict` (the pre-commit guard does).
included:
  - App
  - Core
  - DesignSystem
  - Features
  - Tests
excluded:
  - Derived
  - .build

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - yoda_condition

disabled_rules:
  - todo # CLAUDE.md forbids leaving TODOs at all; a lint warning is redundant.

analyzer_rules:
  - unused_import

# CLAUDE.md hard rules: no force unwraps, no try!, no as! outside tests.
force_unwrapping:
  severity: error
force_cast:
  severity: error
force_try:
  severity: error

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true
type_body_length:
  warning: 300
  error: 400
file_length:
  warning: 500
  error: 700
function_body_length:
  warning: 60
  error: 100
cyclomatic_complexity:
  warning: 12
  error: 20
# Response DTOs are scoped inside the one function that decodes them, which
# reads better than a file full of near-identical top-level shapes.
nesting:
  type_level: 2

identifier_name:
  min_length: 2
  excluded: [id, up, ok, to]
type_name:
  min_length: 3

custom_rules:
  no_print:
    name: "No print()"
    regex: '(^|[^A-Za-z0-9_.])print\('
    message: "Use os.Logger with a subsystem + category, never print()."
    severity: error
    match_kinds: [identifier]
  # `Text("literal")` is localized (LocalizedStringKey), so only `Text(verbatim:)`,
  # which opts out of localization, is flagged.
  no_verbatim_display_text:
    name: "Localize display text"
    regex: 'Text\(verbatim:'
    message: "Text(verbatim:) opts out of localization — use Text(\"…\") or String(localized:)."
    severity: error
